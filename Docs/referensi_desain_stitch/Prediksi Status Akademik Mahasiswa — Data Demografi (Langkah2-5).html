<style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #8e8e8e;
      --nav-text: #2e2e2e;
      --pill-dark: #28282a;
      --nav-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      --glass-bg: rgba(40, 40, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      --field-bg: rgba(255, 255, 255, 0.06);
      --field-border: rgba(255, 255, 255, 0.14);
      --field-focus: rgba(255, 255, 255, 0.55);
      --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
      --font-display: "BubbledotICG-FinePos", monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Ambient background simulation matching cinematic video backdrop */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 48%, rgba(28, 38, 54, 0.35) 0%, rgba(10, 14, 20, 0.18) 45%, #000000 85%);
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      transform: scale(1.05);
      filter: saturate(1.1) brightness(0.85);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.88) 100%);
      pointer-events: none;
    }

    /* Main container */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(16px, 2.4vh, 28px) clamp(14px, 3vw, 32px);
    }

    /* HEADER */
    .header {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 2.8vw, 28px);
      flex-shrink: 0;
      margin-bottom: clamp(16px, 2vh, 26px);
      animation: slideDown 0.7s var(--ease) both;
    }

    .logo-btn {
      width: clamp(40px, 4.4vw, 46px);
      height: clamp(40px, 4.4vw, 46px);
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--nav-shadow);
      text-decoration: none;
      transition: transform 0.25s ease;
      flex-shrink: 0;
      cursor: pointer;
    }

    .logo-btn:hover {
      transform: scale(1.04);
    }

    .logo-svg {
      width: 72%;
      height: 72%;
      display: block;
    }

    .nav-pill {
      height: clamp(44px, 5.2vw, 48px);
      width: 100%;
      max-width: 280px;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: var(--nav-shadow);
      display: flex;
      align-items: center;
      padding: 4px 8px;
      position: relative;
    }

    .nav-link {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--nav-text);
      opacity: 0.5;
      transition: opacity 0.2s ease;
      position: relative;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .nav-link:hover {
      opacity: 0.75;
    }

    .nav-link.active {
      opacity: 1;
      color: var(--nav-text);
    }

    /* Three tiny dots under active link */
    .active-dots {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      background: #2e2e2e;
      border-radius: 50%;
      box-shadow: -5px 0 0 #2e2e2e, 5px 0 0 #2e2e2e;
    }

    /* STAGE / GLASS PANEL */
    .stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .panel {
      width: min(760px, 100%);
      height: min(100%, 600px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      padding: clamp(20px, 2.4vw, 28px);
      display: flex;
      flex-direction: column;
      animation: panelIn 0.7s var(--ease) both;
    }

    /* Header inside panel */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .panel-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.8vw, 28px);
      font-weight: 400;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .panel-desc {
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.4;
    }

    .step-counter {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
      padding-top: 4px;
      white-space: nowrap;
    }

    /* Stepper & Progress */
    .stepper-wrap {
      margin-bottom: 20px;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      width: 20%;
      height: 100%;
      background: #ffffff;
      border-radius: 999px;
      transition: width 0.4s var(--ease);
    }

    .steps-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      transition: all 0.3s var(--ease);
      flex-shrink: 0;
    }

    .step-item.active .step-dot {
      width: 22px;
      height: 8px;
      background: #ffffff;
    }

    .step-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .step-item.active .step-label {
      color: #ffffff;
    }

    /* Scrollable Fields Grid */
    .fields-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      margin-right: -4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
      mask-image: linear-gradient(to bottom, black calc(100% - 16px), transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 16px), transparent 100%);
    }

    .fields-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .fields-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    .fields-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
      padding-bottom: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .field-hint {
      font-size: 11.5px;
      color: var(--muted);
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
    }

    /* Controls styling */
    .control-base {
      height: 46px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 14px;
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      padding: 0 14px;
      outline: none;
      transition: all 0.25s var(--ease);
      width: 100%;
      display: flex;
      align-items: center;
    }

    .control-base:focus,
    .control-base:focus-within {
      border-color: var(--field-focus);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Custom Dropdown select */
    .select-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-select {
      height: 46px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 14px;
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 0 36px 0 14px;
      width: 100%;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }

    .custom-select:focus {
      border-color: var(--field-focus);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
    }

    .custom-select option {
      background: #1c1c1e;
      color: #ffffff;
      padding: 8px;
    }

    .custom-select option[disabled] {
      color: #8e8e8e;
    }

    .select-chevron {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #8e8e8e;
      font-size: 11px;
      transition: transform 0.25s var(--ease);
    }

    .select-wrapper:focus-within .select-chevron {
      transform: translateY(-50%) rotate(180deg);
      color: #ffffff;
    }

    /* Number input without spinners */
    .number-input {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .number-input::-webkit-outer-spin-button,
    .number-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .number-input::placeholder {
      color: #555558;
    }

    /* Segmented binary control */
    .segmented-control {
      height: 46px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 14px;
      display: flex;
      padding: 3px;
      gap: 3px;
      position: relative;
    }

    .segment-opt {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13.5px;
      font-weight: 500;
      color: #b0b0b4;
      cursor: pointer;
      border-radius: 11px;
      transition: all 0.2s var(--ease);
      user-select: none;
      border: none;
      background: transparent;
      outline: none;
    }

    .segment-opt:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .segment-opt.selected {
      background: #ffffff;
      color: #111111;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
    }

    /* ACTIONS ROW */
    .panel-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 18px;
      margin-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .btn-next {
      background: #ffffff;
      color: #000000;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 30px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 0 18px rgba(255, 255, 255, 0.28);
      transition: all 0.25s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-next:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 24px rgba(255, 255, 255, 0.45);
    }

    .btn-next:active {
      transform: scale(0.98);
    }

    /* Animations */
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.97);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    @media (max-width: 720px) {
      .panel {
        height: 100%;
        border-radius: 22px;
        padding: 18px 16px;
      }
      .fields-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .steps-row .step-label:not(.active-label) {
        display: none;
      }
      .panel-header {
        margin-bottom: 12px;
      }
    }
  </style>

<script>
  // Extended segmented control logic for Step 2
  function selectSegment(btn) {
    const parent = btn.parentElement;
    const buttons = parent.querySelectorAll('.segment-opt');
    buttons.forEach(b => {
      b.classList.remove('selected');
      b.setAttribute('aria-checked', 'false');
    });
    btn.classList.add('selected');
    btn.setAttribute('aria-checked', 'true');

    // Sync with hidden input
    const hiddenInput = document.getElementById('daytime-attendance');
    if (hiddenInput && btn.dataset.val !== undefined) {
      hiddenInput.value = btn.dataset.val;
    }
  }
</script></main>
