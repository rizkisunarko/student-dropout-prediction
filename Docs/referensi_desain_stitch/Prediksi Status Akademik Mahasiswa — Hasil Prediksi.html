<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Prediksi Status Akademik Mahasiswa — Hasil Prediksi</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- BubbledotICG-FinePos Font for Retro Dot Matrix Title -->
<link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet" type="text/css"/>
<!-- FontAwesome 6.5.2 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-dotmatrix {
      font-family: 'BubbledotICG-FinePos', 'Courier New', monospace;
      letter-spacing: 0.04em;
    }
  </style>
<style data-purpose="layout-effects">
    /* Deep space cinematic dark background vignette */
    .bg-vignette {
      background-color: #000000;
      background-image: radial-gradient(ellipse at center, rgba(18, 18, 20, 0.45) 0%, rgba(0, 0, 0, 0.95) 100%);
    }

    /* Primary Glassmorphism Container */
    .glass-panel {
      background: rgba(40, 40, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      border-radius: 28px;
    }

    /* Glows matching the exact mockup specs */
    .dot-dropout-glow {
      box-shadow: 0 0 8px rgba(255, 122, 122, 0.4);
    }
    .bar-dropout-glow {
      box-shadow: 0 0 10px rgba(255, 122, 122, 0.35);
    }
    .btn-white-glow {
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.28);
    }
    .nav-pill-shadow {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    }
  </style>
</head>
<body class="bg-vignette text-white h-screen w-screen overflow-hidden flex flex-col justify-between items-center select-none antialiased p-6">
<!-- BEGIN: TopNavigation -->
<!-- Top centered header containing brand icon and segmented tab navigation -->
<header class="w-full flex items-center justify-center gap-3 pt-4 sm:pt-6 z-20" data-purpose="top-navigation-bar">
<!-- Brand Icon Button (Round white container with academic cap icon) -->
<div class="w-[46px] h-[46px] rounded-full bg-white flex items-center justify-center nav-pill-shadow shrink-0 cursor-pointer" data-purpose="brand-logo" title="Prediksi Status Akademik">
<svg class="w-[22px] h-[22px]" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewbox="0 0 24 24">
<path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
<path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
</svg>
</div>
<!-- Capsule Navigation Container -->
<nav class="bg-white rounded-full h-[46px] px-8 flex items-center justify-center gap-9 nav-pill-shadow" data-purpose="segmented-tabs" style="max-width: 280px;">
<!-- Beranda Link (Inactive, 0.5 opacity) -->
<a class="text-[14px] font-[500] text-[#2e2e2e] opacity-50 hover:opacity-75 transition-opacity" href="#">
        Beranda
      </a>
<!-- Prediksi Link (Active, Full opacity with 3-dot indicator underneath) -->
<div class="relative flex flex-col items-center">
<a class="text-[14px] font-[500] text-[#2e2e2e] opacity-100" href="#">
          Prediksi
        </a>
<!-- Three-dot active status indicator -->
<div class="flex items-center gap-[3px] absolute -bottom-2" data-purpose="active-tab-indicator">
<span class="w-[3px] h-[3px] rounded-full bg-[#111111]"></span>
<span class="w-[3px] h-[3px] rounded-full bg-[#111111]"></span>
<span class="w-[3px] h-[3px] rounded-full bg-[#111111]"></span>
</div>
</div>
</nav>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: MainPredictionCard -->
<!-- Centered Result Dialog Panel -->
<main class="w-full flex items-center justify-center flex-1 my-auto z-10" data-purpose="main-content">
<section class="glass-panel w-full p-7 sm:p-9 flex flex-col gap-6" data-purpose="prediction-result-panel" style="max-width: min(640px, 92vw);">
<!-- Card Header: Overline title & Mode Badge -->
<div class="flex items-center justify-between" data-purpose="panel-header">
<span class="text-[12.5px] font-[500] tracking-[0.08em] text-[#8e8e8e] uppercase">
          HASIL PREDIKSI
        </span>
<span class="bg-[#28282a] text-[#c4c2c3] text-[11.5px] font-[500] px-3 py-1 rounded-full border border-white/40">
          MODE DEMO · bukan hasil model
        </span>
</div>
<!-- Result Headline & Meaning Indicator Group -->
<div class="flex flex-col gap-2" data-purpose="outcome-summary">
<!-- Huge Result Label (BubbledotICG-FinePos dot-matrix font) -->
<h1 class="font-dotmatrix text-white text-[54px] sm:text-[68px] leading-none tracking-wide select-none" data-purpose="predicted-class-label" style="font-size: clamp(48px, 6vw, 76px);">
          Dropout
        </h1>
<!-- Meaning subline with status dot -->
<div class="flex items-center gap-2.5 mt-1" data-purpose="status-description">
<span class="w-2 h-2 rounded-full bg-[#FF7A7A] dot-dropout-glow shrink-0"></span>
<p class="text-[13.5px] text-[#c4c2c3] font-[400] leading-snug">
            Berisiko berhenti atau tidak melanjutkan studi.
          </p>
</div>
</div>
<!-- Probability Distribution Section -->
<div class="flex flex-col gap-3.5 pt-1" data-purpose="probability-distribution">
<!-- Row 1: Dropout (Predicted / Dominant) -->
<div class="flex flex-col gap-1.5" data-purpose="prob-item-dropout">
<div class="flex justify-between items-center text-[14px]">
<span class="font-[600] text-white">Dropout</span>
<span class="font-[600] text-white tabular-nums">72.4%</span>
</div>
<!-- Bar Track -->
<div class="w-full h-[6px] bg-white/[0.12] rounded-full overflow-hidden">
<div class="h-full bg-[#FF7A7A] rounded-full bar-dropout-glow" style="width: 72.4%;"></div>
</div>
</div>
<!-- Row 2: Enrolled -->
<div class="flex flex-col gap-1.5" data-purpose="prob-item-enrolled">
<div class="flex justify-between items-center text-[14px]">
<span class="font-[500] text-[#8e8e8e]">Enrolled</span>
<span class="font-[500] text-[#8e8e8e] tabular-nums">18.7%</span>
</div>
<!-- Bar Track -->
<div class="w-full h-[6px] bg-white/[0.12] rounded-full overflow-hidden">
<div class="h-full bg-[#F2C14E] rounded-full" style="width: 18.7%;"></div>
</div>
</div>
<!-- Row 3: Graduate -->
<div class="flex flex-col gap-1.5" data-purpose="prob-item-graduate">
<div class="flex justify-between items-center text-[14px]">
<span class="font-[500] text-[#8e8e8e]">Graduate</span>
<span class="font-[500] text-[#8e8e8e] tabular-nums">8.9%</span>
</div>
<!-- Bar Track -->
<div class="w-full h-[6px] bg-white/[0.12] rounded-full overflow-hidden">
<div class="h-full bg-[#6EE7B7] rounded-full" style="width: 8.9%;"></div>
</div>
</div>
</div>
<!-- Legal / Operational Disclaimer -->
<p class="text-[12px] text-[#8e8e8e] font-[400] leading-normal pt-1" data-purpose="result-disclaimer">
        Prediksi ini adalah pendukung early warning, bukan keputusan akademik final.
      </p>
<!-- Bottom Interactive Action Triggers -->
<div class="flex items-center justify-between pt-3 mt-1" data-purpose="action-buttons">
<!-- Back / Edit Input Button -->
<button class="bg-transparent border border-white/[0.16] hover:border-white/40 text-[#c8c8c8] hover:text-white text-[13.5px] font-[500] py-[10px] px-[22px] rounded-full transition-all duration-200 cursor-pointer active:scale-95" data-purpose="btn-edit-inputs" type="button">
          Ubah Input
        </button>
<!-- Reset / New Prediction Button -->
<button class="bg-white hover:bg-neutral-100 text-[#111111] text-[13.5px] font-[600] py-[11px] px-[26px] rounded-full btn-white-glow transition-all duration-200 cursor-pointer active:scale-95" data-purpose="btn-new-prediction" type="button">
          Prediksi Baru
        </button>
</div>
</section>
</main>
<!-- END: MainPredictionCard -->
<!-- Subtle bottom spacing filler to maintain viewport symmetry -->
<footer aria-hidden="true" class="h-4 sm:h-6 pointer-events-none"></footer>
</body></html>
