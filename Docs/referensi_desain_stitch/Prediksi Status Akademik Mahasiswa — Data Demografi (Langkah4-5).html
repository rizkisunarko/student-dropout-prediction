 font-normal">0–26</span></div><input class="w-full h-[46px] rounded-[14px] bg-inputBg border border-inputBorder text-white text-[13.5px] px-3.5 focus:outline-none focus:border-white/40 focus:ring-0 transition-colors" max="26" min="0" placeholder="0–26" type="number" value="7"/></div><div class="flex flex-col gap-1.5" data-purpose="input-group"><div class="flex items-center justify-between"><label class="text-[12.5px] font-medium text-secondaryText">Curricular units 1st sem (grade)</label><span class="text-[11px] text-white/30 font-normal">0–20</span></div><input class="w-full h-[46px] rounded-[14px] bg-inputBg border text-white text-[13.5px] px-3.5 focus:outline-none focus:ring-0 transition-colors" max="20" min="0" step="0.1" style="border-color: #FF7A7A;" type="number" value="22.5"/><div class="flex items-center gap-1.5 mt-0.5" style="color: #FF7A7A; font-size: 11.5px;"><svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" fill-rule="evenodd"></path></svg><span>Nilai harus antara 0–20</span></div></div><div class="flex flex-col gap-1.5" data-purpose="input-group"><div class="flex items-center justify-between"><label class="text-[12.5px] font-medium text-secondaryText">Curricular units 1st sem (without evaluations)</label><span class="text-[11px] text-white/30 font-normal">0–12</span></div><input class="w-full h-[46px] rounded-[14px] bg-inputBg border border-inputBorder text-white text-[13.5px] px-3.5 focus:outline-none focus:border-white/40 focus:ring-0 transition-colors" max="12" min="0" placeholder="0–12" type="number" value="0"/></div></div><div class="flex items-center gap-1.5 pt-1 select-none" style="color: #F2C14E; font-size: 12px;"><svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" fill-rule="evenodd"></path></svg><span>Jumlah approved lebih besar dari enrolled — periksa kembali.</span></div></div>
